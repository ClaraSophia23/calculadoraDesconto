
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">

        <header>
            <h1>Calculadora de Desconto</h1>
            <p>Calcule o desconto da sua compra!</p>
        </header>

        <section class="calculadora">
            <h2>Dados da compra</h2>

            <div class="campo">
                <label for="total">Valor total da compra (R$)</label>
                <input type="number" id="total"
                       placeholder="Digite o valor" min="0" step="0.01">
            </div>

            <button type="button" onclick="calcularDesconto()">
                Calcular desconto
            </button>

            <div class="resultado">
                <p>Valor do desconto:</p>
                <strong id="valorDesconto">R$ 0,00</strong>

                <p>Total com desconto:</p>
                <strong id="totalDesconto">R$ 0,00</strong>
            </div>

            <p id="mensagem" role="status"></p>
        </section>

        <footer>
            <p>Calculadora de Desconto</p>
        </footer>

    </main>

</body>
</html>
