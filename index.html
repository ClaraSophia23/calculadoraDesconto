
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Calculadora de Desconto</h1>
        <p>Calcule o desconto da sua compra</p>

        <form id="formulario">
            <label for="valor">Valor total da compra (R$):</label>
            <input
                type="number"
                id="valor"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 250.00"
                required
            >

            <label for="desconto">Desconto (%):</label>
            <input
                type="number"
                id="desconto"
                min="0"
                max="100"
                step="0.01"
                placeholder="Ex.: 10"
                required
            >

            <button type="submit">Calcular desconto</button>
        </form>

        <div id="resultado" aria-live="polite">
            <p>Valor do desconto: <strong id="valorDesconto">R$ 0,00</strong></p>
            <p>Total com desconto: <strong id="totalFinal">R$ 0,00</strong></p>
        </div>
    </div>

</body>
</html>
